name: Build Musical World APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -q musical_world_starter.zip -d /tmp/mw
          PROJECT_DIR=$(find /tmp/mw -name pubspec.yaml -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Flutter project not found"
            exit 1
          fi
          cp -R "$PROJECT_DIR"/. .

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project
        run: flutter create . --platforms=android --org com.example --project-name musical_world

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure repositories & fallback mirror
        run: |
          python3 - <<'EOF'
          from pathlib import Path

          path = Path("android/settings.gradle.kts")
          if path.exists():
              text = path.read_text(encoding="utf-8")
              mirror = 'maven { url = uri("https://maven-central.storage-download.googleapis.com/repos/central/data/") }'
              if mirror not in text:
                  text = text.replace(
                      "mavenCentral()",
                      f"mavenCentral()\n        {mirror}",
                  )
              path.write_text(text, encoding="utf-8")
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (with retry on 429 rate limit)
        run: |
          attempt=1
          max_attempts=4
          until flutter build apk --release --no-pub; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "APK build failed after $max_attempts attempts."
              exit 1
            fi
            wait_sec=$((attempt * 15))
            echo "Build failed (likely 429 rate limit). Retrying in ${wait_sec}s (${attempt}/${max_attempts})..."
            sleep "$wait_sec"
            attempt=$((attempt + 1))
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Musical-World-APK
          path: build/app/outputs/flutter-apk/app-release.apk
