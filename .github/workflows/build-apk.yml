
name: Build Musical World APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -q musical_world_starter.zip -d /tmp/mw
          PROJECT_DIR=$(find /tmp/mw -name pubspec.yaml -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Flutter project not found"
            exit 1
          fi
          cp -R "$PROJECT_DIR"/. .

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: flutter create . --platforms=android --org com.example --project-name musical_world

      - name: Ensure Maven Central
        run: |
          sed -i '/repositories {/a\        mavenCentral()' android/settings.gradle.kts

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Musical-World-APK
          path: build/app/outputs/flutter-apk/app-release.apk
